:root {
--ink: #17120e; --ink-2: #1e1712; --panel: #221a14; --panel-hi: #2e2118; --sand: #f2e8d5; --bright: #fbf3e3;
--muted: rgba(242, 232, 213, 0.72); --faint: rgba(242, 232, 213, 0.5); --line: rgba(242, 232, 213, 0.12);
--amber: #e0a872; --terracotta: #c8774a; --focus: #a35a33;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--ink); color: var(--sand); scroll-behavior: smooth; }
body { font: 400 18px/1.75 'Plex', system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
html[lang="en"] body { line-height: 1.65; }
a { color: inherit; }
img { display: block; max-width: 100%; height: auto; }
.wrap { width: min(1120px, 100% - 32px); margin-inline: auto; }
.ruqaa { font-family: 'Ruqaa', serif; font-weight: 700; }
.top { position: absolute; inset-inline: 0; top: 0; z-index: 3; }
.top .wrap { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; }
.mark { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.mark img { width: 36px; height: 36px; border-radius: 9px; }
.mark span { font: 700 26px/1 'Ruqaa', serif; color: #ead9b8; }
.top nav { display: flex; align-items: center; gap: 22px; font-size: 15px; }
.top nav a { text-decoration: none; color: var(--muted); }
.top nav a:hover { color: var(--bright); }
.top nav .lang { padding: 6px 14px; border: 1px solid var(--line); border-radius: 18px; color: var(--sand); }
.hero { position: relative; min-height: min(92vh, 860px); display: flex; align-items: center; overflow: hidden; }
.hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 40%; }
.hero::after { content: ''; position: absolute; inset: 0;
background: linear-gradient(180deg, rgba(23, 18, 14, 0.55) 0%, rgba(23, 18, 14, 0.35) 40%, rgba(23, 18, 14, 0.92) 92%, var(--ink) 100%); }
.hero .wrap { position: relative; z-index: 2; padding: 120px 0 60px; }
.hero h1 { font: 700 clamp(84px, 14vw, 168px)/1.15 'Ruqaa', serif; color: #ead9b8; text-shadow: 0 6px 40px rgba(0, 0, 0, 0.45); }
html[lang="en"] .hero h1 { font: 600 clamp(60px, 10vw, 120px)/1.1 'Plex', sans-serif; letter-spacing: -2px; }
.hero .tag { font-size: clamp(22px, 3vw, 30px); color: var(--amber); margin-top: 2px; }
.hero p.lead { max-width: 640px; margin-top: 18px; font-size: clamp(17px, 2vw, 20px); color: var(--sand); text-shadow: 0 2px 16px rgba(0, 0, 0, 0.5); }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 13px 22px; border-radius: 30px; font-weight: 600; text-decoration: none;
background: var(--terracotta); color: #fff; border: 1px solid transparent; }
.btn:hover { background: var(--focus); }
.btn.ghost { background: rgba(23, 18, 14, 0.55); border-color: rgba(242, 232, 213, 0.25); color: var(--sand); }
.btn.ghost:hover { background: rgba(23, 18, 14, 0.8); }
.btn small { font-weight: 400; font-size: 13px; opacity: 0.8; }
.btn svg { width: 20px; height: 20px; fill: currentColor; }
.pills { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 22px; color: var(--muted); font-size: 15px; }
.pills span::before { content: '✦'; color: var(--amber); margin-inline-end: 8px; font-size: 11px; vertical-align: 2px; }
.tv { margin: -40px auto 0; position: relative; z-index: 2; width: min(1000px, 100% - 32px); }
.tv .screen { border-radius: 14px; overflow: hidden; border: 10px solid #0d0a08; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(242, 232, 213, 0.08); }
.tv .stand { width: 26%; height: 14px; margin: 0 auto; background: linear-gradient(#0d0a08, #070504); border-radius: 0 0 10px 10px; }
.caption { text-align: center; color: var(--faint); font-size: 14px; margin-top: 14px; }
section { padding: 96px 0 0; }
.eyebrow { color: var(--amber); font-size: 15px; letter-spacing: 0.02em; }
h2 { font: 700 clamp(38px, 5vw, 56px)/1.25 'Ruqaa', serif; color: var(--bright); margin: 4px 0 14px; }

@media (max-width: 560px) { .features { grid-template-columns: 1fr; } }
.card { padding: 24px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); }

.card .ic svg { width: 24px; height: 24px; fill: currentColor; }
.card h3 { font-size: 19px; font-weight: 600; color: var(--bright); margin-bottom: 6px; }

.card.star { background: linear-gradient(135deg, rgba(200, 119, 74, 0.28), rgba(200, 119, 74, 0.06)); border-color: rgba(224, 168, 114, 0.3); }
.day { margin-top: 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.day div { padding: 22px 18px 6px 0; position: relative; }
html[dir="rtl"] .day div { padding: 22px 0 6px 18px; }

@media (max-width: 820px) { .laptop { grid-template-columns: 1fr; } .laptop img { margin-inline: auto; } }

.laptop li { padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
.laptop li b { color: var(--sand); font-weight: 600; }
.promise { margin-top: 96px; padding: 44px; border-radius: 22px; background: var(--ink-2); border: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
.promise .ic { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: rgba(200, 119, 74, 0.18); color: var(--amber); }
.promise .ic svg { width: 34px; height: 34px; fill: currentColor; }
.promise h2 { font-size: clamp(30px, 4vw, 40px); margin: 0 0 6px; }
@media (max-width: 620px) { .promise { grid-template-columns: 1fr; padding: 28px; } }
.faq { margin-top: 30px; max-width: 820px; }
.faq details { border-bottom: 1px solid var(--line); padding: 16px 0; }
.faq summary { cursor: pointer; font-weight: 600; color: var(--bright); list-style: none; display: flex; justify-content: space-between; gap: 16px; }
.faq summary::after { content: '+'; color: var(--amber); font-size: 22px; line-height: 1; }
.faq details[open] summary::after { content: '–'; }
.faq summary::-webkit-details-marker { display: none; }
.faq p { color: var(--muted); margin-top: 8px; }
footer { margin-top: 110px; padding: 40px 0 50px; border-top: 1px solid var(--line); color: var(--faint); font-size: 14px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 14px 30px; justify-content: space-between; }
footer nav { display: flex; gap: 20px; flex-wrap: wrap; }
footer a { color: var(--muted); }
footer .credit { flex-basis: 100%; font-size: 13px; }
.doc { padding: 120px 0 0; max-width: 760px; }
.doc h1 { font: 700 52px/1.2 'Ruqaa', serif; color: var(--bright); }
html[lang="en"] .doc h1 { font: 600 40px/1.2 'Plex', sans-serif; }
.doc .date { color: var(--faint); font-size: 14px; margin-top: 6px; }
.doc h2 { font: 600 22px/1.4 'Plex', sans-serif; color: var(--amber); margin: 34px 0 8px; }
.doc p { color: var(--muted); }
.top.solid { position: static; border-bottom: 1px solid var(--line); }
@media (max-width: 620px) {
body { font-size: 17px; }
.top nav a:not(.lang) { display: none; }

section { padding-top: 72px; }
